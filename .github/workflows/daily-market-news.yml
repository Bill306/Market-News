name: Daily Market News Briefing

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = Beijing time 8:00
  workflow_dispatch:        # Manual trigger for testing

permissions:
  contents: write           # Allow pushing reports to repo

jobs:
  generate-and-deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate market report
        id: report
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_MODEL: deepseek-chat
        run: python scripts/generate_report.py

      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "Daily market report — $(date -u +%Y-%m-%d)" || true
          git push
